services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ChangeMe
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: ChangeMe
    ports:
      - "3307:3306"
    volumes:
      - ./data/db:/var/lib/mysql

  minio:
    # MinIO no longer publishes public images (quay.io answers 401, Docker Hub removed
    # them). This tag must already be in the local image cache — see
    # ABAC_NII handover/README.md, "MinIO images". Keep in sync with start-local.sh.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:3000"
      - "443:3000"
    volumes:
      - ./public:/app/public
    depends_on:
      - db