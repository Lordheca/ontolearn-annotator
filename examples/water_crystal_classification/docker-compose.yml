services:
  playground:
    build:
      context: .
      dockerfile: ./01_playground/Dockerfile 
    volumes:
      - ./01_playground:/app
    environment:
      PROJECT_ID: ${PROJECT_ID}
      PLATFORM_URL: ${PLATFORM_URL}
      API_KEY: ${API_KEY}
    restart: always
    command: bash -c "python3 -u /app/playground.py"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: 1